services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
        VITE_APP_API_URL: ${VITE_APP_API_URL}
        VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY}
        VITE_DROP_CONSOLE: ${VITE_DROP_CONSOLE:-true}
    container_name: react-vite-web
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - app-network

  # ---------------------------------------------------------------
  # Backend: set BACKEND_IMAGE in .env.production (loaded by deploy.sh).
  # Example: BACKEND_IMAGE=youruser/nest-api:latest
  #
  # Nginx proxies /api/ and /socket.io/ to this service on port 9001.
  # ---------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-node:20-alpine}
    container_name: react-vite-backend
    restart: unless-stopped
    working_dir: /app
    # volumes:
    #   - ../nest-api:/app
    # command: ["node", "dist/main.js"]
    expose:
      - '9001'
    env_file:
      - .env.production
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: react-vite-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot-conf:
  certbot-www:

networks:
  app-network:
    driver: bridge
