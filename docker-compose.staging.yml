# =============================================================================
# DOCKER COMPOSE -- STAGING ENVIRONMENT
# =============================================================================
#
# File nay dinh nghia container cho moi truong STAGING.
# Staging dung de test truoc khi release len production.
#
# Cach chay:
#   docker compose -f docker-compose.staging.yml up -d
#
# Cach dung:
#   docker compose -f docker-compose.staging.yml down
#
# Xem log:
#   docker compose -f docker-compose.staging.yml logs -f
#
# Luu y:
#   - Image duoc build boi GitLab CI va push len GitLab Container Registry.
#   - Tren VPS, file nay chi pull image tu registry, KHONG build local.
#   - Bien IMAGE_TAG duoc set boi deploy.sh hoac truyen qua environment.
#
# =============================================================================

services:
  web-staging:
    # -- IMAGE --
    # Image duoc pull tu GitLab Container Registry.
    # ${CI_REGISTRY_IMAGE} la dia chi registry (VD: registry.gitlab.com/group/project)
    # ${IMAGE_TAG} la tag cua image (VD: staging-abc1234)
    # Neu khong set, mac dinh dung tag "staging-latest"
    # image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/your-group/your-project}:${IMAGE_TAG:-staging-latest}
    image: registry.gitlab.com/nvduong2302/travel-vn-fe:staging-latest
    # -- CONTAINER NAME --
    # Dat ten co dinh de de quan ly (xem log, restart, ...)
    container_name: frontend-staging

    # -- PORT MAPPING --
    # Chi bind localhost: Nginx host :443 proxy vao day (xem deploy/host-nginx).
    ports:
      - '127.0.0.1:8080:80'

    # -- RESTART POLICY --
    # unless-stopped: tu dong restart container neu bi crash hoac VPS reboot.
    # Chi dung khi user manually stop container (docker compose down).
    restart: unless-stopped

    # -- RESOURCE LIMITS --
    # Gioi han tai nguyen cho staging de khong anh huong production.
    # staging khong can nhieu resources nhu production.
    deploy:
      resources:
        limits:
          cpus: '0.5' # Toi da 50% cua 1 CPU core
          memory: 128M # Toi da 128MB RAM (nginx serve static, khong can nhieu)
        reservations:
          cpus: '0.1' # Dam bao toi thieu 10% CPU
          memory: 32M # Dam bao toi thieu 32MB RAM

    # -- HEALTH CHECK --
    # Docker tu dong kiem tra container con hoat dong khong.
    # Goi /health endpoint (dinh nghia trong nginx.conf).
    # Neu fail 3 lan lien tiep -> container duoc danh dau "unhealthy".
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1/health',
        ]
      interval: 30s # Kiem tra moi 30 giay
      timeout: 3s # Timeout sau 3 giay
      start_period: 10s # Cho 10 giay sau khi start truoc khi check
      retries: 3 # Fail 3 lan lien tiep -> unhealthy

    # -- NETWORK --
    # Use network "staging" defined in docker-compose.yml
    networks:
      - travel-vn-dev-network
    # -- LOGGING --
    # Gioi han log size de tranh day disk tren VPS.
    # max-size 10m: moi file log toi da 10MB
    # max-file 3: giu toi da 3 file log (tong 30MB)
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  travel-vn-dev-network:
    name: travel-vn-dev-network
    driver: bridge
