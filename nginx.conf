# =============================================================================
# NGINX CONFIG -- Serve React Vite SPA (static files)
# =============================================================================
#
# File nay duoc COPY vao Docker image tai /etc/nginx/conf.d/default.conf
# Dung chung cho ca staging va production (khong co gi khac nhau).
#
# Chuc nang chinh:
#   1. SPA fallback  -- tat ca route tra ve index.html (React Router xu ly)
#   2. Asset caching  -- JS/CSS/images cache 1 nam (Vite hash filenames)
#   3. Gzip           -- nen response de giam bandwidth
#   4. Security        -- headers bao ve co ban (XSS, clickjacking, MIME sniffing)
#   5. No-cache HTML   -- index.html luon load version moi nhat
#
# =============================================================================

server {
    # -------------------------------------------------------------------------
    # LISTEN
    # -------------------------------------------------------------------------
    # Nginx trong container listen port 80.
    # Port nay duoc map ra host port khac nhau tuy moi truong (xem docker-compose).
    listen 80;
    server_name _;

    # -------------------------------------------------------------------------
    # ROOT & INDEX
    # -------------------------------------------------------------------------
    # Thu muc chua static files (dist/ tu Vite build).
    # index.html la entry point cua SPA.
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # GZIP COMPRESSION
    # -------------------------------------------------------------------------
    # Bat gzip de nen response truoc khi gui cho browser.
    # Giam dung luong truyen tai 60-80% cho text-based files.
    # vary on: gui header Vary: Accept-Encoding de CDN/proxy cache dung.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # -------------------------------------------------------------------------
    # SPA FALLBACK (quan trong nhat)
    # -------------------------------------------------------------------------
    # React Router dung client-side routing (VD: /dashboard/tours).
    # Khi user refresh trang hoac truy cap truc tiep URL, nginx can tra ve index.html
    # de React Router xu ly routing phia client.
    #
    # try_files: thu tim file/folder tuong ung truoc.
    # Neu khong tim thay (VD: /dashboard/tours khong phai file that) -> tra ve /index.html.
    # Neu khong co dong nay, user refresh se bi 404.
    location / {
        try_files $uri $uri/ /index.html;

        # -- Security Headers --

        # Chong clickjacking: khong cho phep trang bi nhung trong iframe cua domain khac
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Chong MIME sniffing: browser khong duoc tu doan content type
        add_header X-Content-Type-Options "nosniff" always;

        # Referrer policy: chi gui origin (khong gui full URL) khi navigate ra ngoai
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # -------------------------------------------------------------------------
    # STATIC ASSETS CACHING (JS, CSS, images, fonts)
    # -------------------------------------------------------------------------
    # Vite build ra cac file co hash trong ten (VD: index-abc123.js).
    # Khi code thay doi, hash thay doi -> ten file moi -> browser tai file moi.
    # Vi vay an toan khi cache lau (1 nam).
    #
    # "public, immutable": browser va CDN deu duoc cache, khong can revalidate.
    # Giam tai cho server, tang toc cho user (file lay tu cache local).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # Van giu security headers cho static files
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -------------------------------------------------------------------------
    # INDEX.HTML -- KHONG CACHE
    # -------------------------------------------------------------------------
    # index.html la entry point duy nhat cua SPA.
    # File nay chua <script> tags tro den cac JS files (co hash).
    # Khi deploy version moi, index.html thay doi (tro den JS files moi).
    # Neu browser cache index.html cu -> user se thay version cu.
    #
    # no-cache: browser van luu nhung phai hoi server xem co version moi khong (revalidate).
    # no-store: khong luu vao cache (an toan hon nhung cham hon 1 chut).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # -------------------------------------------------------------------------
    # HEALTH CHECK ENDPOINT
    # -------------------------------------------------------------------------
    # Docker HEALTHCHECK va monitoring tools goi endpoint nay.
    # Tra ve 200 OK neu nginx dang chay binh thuong.
    # access_log off: khong ghi log cho health check (tranh spam log).
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # BLOCK DOT FILES (bao mat)
    # -------------------------------------------------------------------------
    # Chan truy cap vao cac file an (VD: .env, .git, .htaccess).
    # Tra ve 403 Forbidden. Phong truong hop file bi COPY nham vao image.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
